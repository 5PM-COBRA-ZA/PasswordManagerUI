kind: Deployment
apiVersion: apps/v1
metadata:
  name: passwordmanagerui
  namespace: password-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passwordmanagerui
  template:
    metadata:
      labels:
        app: passwordmanagerui
    spec:
      containers:
        - name: passwordmanagerui
          image: 192.168.0.241:32500/passwordmanager/ui:latest
          ports:
            - containerPort: 80
              protocol: TCP
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

